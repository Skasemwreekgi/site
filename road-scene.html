<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Green Hyundai Accent parked on the sidewalk</title>
<meta name="description" content="A realistic 1998 dark-green Hyundai Accent parked, static, on the pavement (πεζοδρόμιο) beside a real asphalt road." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --ease-out-quint:cubic-bezier(.23,1,.32,1);
    --ease-in-out-cubic:cubic-bezier(.645,.045,.355,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:#0d1117;
    font-family:"Poppins",system-ui,sans-serif;
    overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;min-height:100dvh;
  }

  .scene{
    position:relative;
    width:min(100vw,1100px);
    aspect-ratio:16/9;
    overflow:hidden;
    border-radius:14px;
    box-shadow:0 30px 70px rgba(0,0,0,.55);
    isolation:isolate;
    background:#9fb6c4;
  }

  /* cinematic camera push-in (Ken Burns) — slow, professional */
  .camera{
    position:absolute;inset:0;z-index:0;
    transform-origin:52% 62%;
    animation:push 22s var(--ease-in-out-cubic) infinite alternate;
  }
  @keyframes push{from{transform:scale(1.02)}to{transform:scale(1.10) translateX(-1.2%)}}

  /* ---------- SKY ---------- */
  .sky{
    position:absolute;inset:0;z-index:0;
    background:
      linear-gradient(180deg,#8fb3cc 0%,#aecada 30%,#cdddE4 50%);
  }
  .haze{
    position:absolute;left:0;right:0;top:34%;height:14%;z-index:1;
    background:linear-gradient(180deg,rgba(220,228,232,.85),rgba(220,228,232,0));
    filter:blur(2px);
  }

  /* far tree / shrub line behind the lot */
  .treeline{
    position:absolute;left:0;right:0;top:38%;height:12%;z-index:1;
    background:
      radial-gradient(40px 26px at 8% 100%,#3d5236 60%,transparent 62%),
      radial-gradient(60px 34px at 22% 100%,#46603a 60%,transparent 62%),
      radial-gradient(50px 30px at 40% 100%,#384b30 60%,transparent 62%),
      radial-gradient(70px 36px at 60% 100%,#445c39 60%,transparent 62%),
      radial-gradient(46px 28px at 78% 100%,#35472d 60%,transparent 62%),
      radial-gradient(60px 32px at 92% 100%,#43583a 60%,transparent 62%);
    filter:blur(1px) saturate(.85);opacity:.92;
  }

  /* ---------- GRAVEL LOT / FAR GROUND ---------- */
  .lot{
    position:absolute;left:0;right:0;top:47%;height:20%;z-index:2;
    background:
      linear-gradient(180deg,#c8bca6 0%,#b6a98f 100%);
    background-blend-mode:multiply;
  }
  .lot::after{ /* speckle texture */
    content:"";position:absolute;inset:0;opacity:.35;
    background-image:
      radial-gradient(1px 1px at 10% 20%,#7a6f59 50%,transparent 52%),
      radial-gradient(1px 1px at 30% 60%,#8a7e66 50%,transparent 52%),
      radial-gradient(1.5px 1.5px at 55% 35%,#6f6450 50%,transparent 52%),
      radial-gradient(1px 1px at 72% 70%,#857a62 50%,transparent 52%),
      radial-gradient(1.5px 1.5px at 88% 30%,#6a604c 50%,transparent 52%),
      radial-gradient(1px 1px at 45% 80%,#7d7259 50%,transparent 52%);
    background-size:120px 120px;
  }

  /* ---------- SIDEWALK / ΠΕΖΟΔΡΟΜΙΟ (raised kerb the car is parked on) ---------- */
  .kerb-face{ /* vertical face of the kerb */
    position:absolute;left:0;right:0;top:65%;height:4%;z-index:3;
    background:linear-gradient(180deg,#9a958c,#6f6b63);
    box-shadow:inset 0 2px 0 rgba(255,255,255,.25);
  }
  .sidewalk{
    position:absolute;left:0;right:0;top:67%;height:13%;z-index:3;
    background:
      linear-gradient(180deg,#cfccc6 0%,#b9b6af 100%);
  }
  /* paving slab joints */
  .sidewalk::before{
    content:"";position:absolute;inset:0;opacity:.45;
    background-image:
      repeating-linear-gradient(90deg,transparent 0 78px,#8f8c85 78px 80px),
      repeating-linear-gradient(0deg,transparent 0 40px,#8f8c85 40px 42px);
    background-size:80px 42px;
    transform:perspective(300px) rotateX(34deg);
    transform-origin:top;
  }

  /* ---------- ASPHALT ROAD (foreground, real tarmac) ---------- */
  .road{
    position:absolute;left:0;right:0;bottom:0;height:22%;z-index:4;
    background:
      linear-gradient(180deg,#54585e 0%,#3c4046 30%,#2e3137 100%);
  }
  .road::after{ /* asphalt grain */
    content:"";position:absolute;inset:0;opacity:.5;mix-blend-mode:overlay;
    background-image:
      radial-gradient(1px 1px at 12% 30%,#fff 50%,transparent 52%),
      radial-gradient(1px 1px at 28% 70%,#000 50%,transparent 52%),
      radial-gradient(1.4px 1.4px at 52% 40%,#fff 50%,transparent 52%),
      radial-gradient(1px 1px at 70% 65%,#000 50%,transparent 52%),
      radial-gradient(1.3px 1.3px at 86% 25%,#fff 50%,transparent 52%),
      radial-gradient(1px 1px at 44% 85%,#000 50%,transparent 52%);
    background-size:90px 70px;
  }
  /* worn kerb line / gutter where asphalt meets kerb */
  .gutter{
    position:absolute;left:0;right:0;top:79%;height:1.4%;z-index:4;
    background:linear-gradient(180deg,#1f2227,#3c4046);
    opacity:.8;
  }

  /* ---------- CAR (parked, static) ---------- */
  .car{
    position:absolute;z-index:6;left:50%;top:34%;width:62%;height:auto;
    transform:translateX(-50%);
    opacity:0;
    animation:fadeIn 1s var(--ease-out-quint) .2s forwards;
    filter:drop-shadow(0 22px 18px rgba(0,0,0,.45));
  }
  @keyframes fadeIn{to{opacity:1}}

  /* contact shadow pooled under the parked car */
  .car-shadow{
    position:absolute;z-index:5;left:50%;top:73%;width:54%;height:5%;
    transform:translateX(-50%);
    background:radial-gradient(ellipse at center,rgba(0,0,0,.55),rgba(0,0,0,.2) 55%,transparent 72%);
    filter:blur(3px);
    opacity:0;animation:fadeIn 1.2s ease .3s forwards;
  }

  /* ---------- WOMAN on the sidewalk, right side ---------- */
  .woman{
    position:absolute;z-index:6;right:6%;top:46%;width:9%;height:auto;
    transform-origin:bottom center;
    opacity:0;transform:translateY(20px);
    animation:riseUp 1s var(--ease-out-quint) .6s forwards;
    filter:drop-shadow(0 10px 8px rgba(0,0,0,.35));
  }
  .woman .sway{transform-origin:bottom center;animation:sway 5s var(--ease-in-out-cubic) 1.6s infinite alternate}
  @keyframes riseUp{to{opacity:1;transform:translateY(0)}}
  @keyframes sway{from{transform:rotate(-1.1deg)}to{transform:rotate(1.1deg)}}

  /* sign post in the back, for realism */
  .sign{
    position:absolute;z-index:5;left:11%;top:30%;width:18%;
    opacity:0;animation:fadeIn 1s ease .1s forwards;
  }

  /* drifting clouds */
  .cloud{
    position:absolute;z-index:1;background:#fff;border-radius:60px;opacity:.85;
    filter:blur(.5px) drop-shadow(0 6px 10px rgba(0,0,0,.05));
  }
  .cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
  .c1{top:8%;left:-25%;width:150px;height:40px;animation:drift 60s linear infinite}
  .c1::before{width:62px;height:62px;top:-28px;left:26px}
  .c1::after{width:48px;height:48px;top:-20px;left:80px}
  .c2{top:18%;left:-35%;width:110px;height:30px;transform:scale(.85);animation:drift 80s linear infinite 10s}
  .c2::before{width:46px;height:46px;top:-20px;left:20px}
  .c2::after{width:36px;height:36px;top:-14px;left:58px}
  @keyframes drift{from{transform:translateX(0)}to{transform:translateX(170vw)}}

  /* floating dust motes in the sunlight — very subtle */
  .motes{position:absolute;inset:0;z-index:7;pointer-events:none;overflow:hidden}
  .mote{
    position:absolute;width:4px;height:4px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,250,235,.9),rgba(255,250,235,0) 70%);
    opacity:0;animation:float linear infinite;
  }
  @keyframes float{
    0%{opacity:0;transform:translateY(20px) translateX(0)}
    15%{opacity:.8}
    85%{opacity:.6}
    100%{opacity:0;transform:translateY(-80px) translateX(24px)}
  }

  /* professional vignette + warm light grade + faint grain */
  .grade{
    position:absolute;inset:0;z-index:8;pointer-events:none;
    background:
      radial-gradient(120% 90% at 18% 22%,rgba(255,238,200,.22),transparent 45%),
      radial-gradient(140% 120% at 50% 60%,transparent 55%,rgba(0,0,0,.32) 100%);
    mix-blend-mode:multiply;
  }
  .grade::after{
    content:"";position:absolute;inset:0;opacity:.05;mix-blend-mode:overlay;
    background-image:radial-gradient(1px 1px at 25% 30%,#fff 50%,transparent 52%),
      radial-gradient(1px 1px at 65% 70%,#000 50%,transparent 52%),
      radial-gradient(1px 1px at 80% 20%,#fff 50%,transparent 52%);
    background-size:5px 5px;
    animation:grain .4s steps(2) infinite;
  }
  @keyframes grain{to{transform:translate(2px,1px)}}

  /* glossy paint sheen sweep — restrained, every few seconds */
  .sheen{animation:sheen 7s var(--ease-in-out-cubic) 2s infinite}
  @keyframes sheen{
    0%{transform:translateX(0) skewX(-22deg)}
    55%{transform:translateX(900px) skewX(-22deg)}
    100%{transform:translateX(900px) skewX(-22deg)}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important}
    .camera{transform:none}
    .car,.car-shadow,.woman,.sign{opacity:1;transform:none}
    .woman{transform:none}
    .car{transform:translateX(-50%)}
    .mote{display:none}
  }
</style>
</head>
<body>
  <div class="scene">
   <div class="camera">
    <div class="sky"></div>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="treeline"></div>
    <div class="haze"></div>
    <div class="lot"></div>

    <!-- background AUTO shop sign, like the photo -->
    <svg class="sign" viewBox="0 0 260 120" aria-hidden="true">
      <rect x="6" y="20" width="248" height="56" rx="4" fill="#0e1f3a" stroke="#0a1424" stroke-width="3"/>
      <text x="130" y="46" text-anchor="middle" font-family="Poppins,Arial" font-weight="700" font-size="26" fill="#e9eef6">AUTO</text>
      <text x="130" y="68" text-anchor="middle" font-family="Poppins,Arial" font-weight="700" font-size="14" fill="#9fb4d6" letter-spacing="3">SPARE PARTS</text>
      <rect x="24" y="76" width="6" height="44" fill="#6c6f75"/>
      <rect x="230" y="76" width="6" height="44" fill="#6c6f75"/>
    </svg>

    <div class="kerb-face"></div>
    <div class="sidewalk"></div>
    <div class="gutter"></div>
    <div class="road"></div>

    <!-- ===== WOMAN standing on the pavement, right ===== -->
    <svg class="woman" viewBox="0 0 120 260" role="img" aria-label="A beautiful woman standing on the pavement.">
      <g class="sway">
        <path d="M40 44 C26 50 24 96 34 130 C40 150 44 120 44 96 C44 70 48 52 40 44Z" fill="#3a2417"/>
        <path d="M80 44 C94 50 96 96 86 130 C80 150 76 120 76 96 C76 70 72 52 80 44Z" fill="#3a2417"/>
        <rect x="52" y="176" width="7" height="62" rx="3.5" fill="#e8b98f"/>
        <rect x="61" y="176" width="7" height="62" rx="3.5" fill="#e8b98f"/>
        <path d="M50 236 h12 l3 8 h-18 z" fill="#7a1020"/>
        <path d="M59 236 h12 l3 8 h-18 z" fill="#7a1020"/>
        <path d="M60 96 C44 96 40 110 38 132 L34 200 C44 210 76 210 86 200 L82 132 C80 110 76 96 60 96Z" fill="#d4243a"/>
        <path d="M60 96 C52 96 47 112 46 134 L44 198 C52 203 68 203 76 198 L74 134 C73 112 68 96 60 96Z" fill="#e8455a" opacity=".6"/>
        <path d="M44 108 C34 124 32 150 36 172" stroke="#e8b98f" stroke-width="8" stroke-linecap="round" fill="none"/>
        <path d="M76 108 C86 124 88 150 84 172" stroke="#e8b98f" stroke-width="8" stroke-linecap="round" fill="none"/>
        <rect x="55" y="78" width="10" height="18" rx="5" fill="#e8b98f"/>
        <circle cx="60" cy="60" r="22" fill="#f0c49a"/>
        <path d="M38 58 C36 34 52 22 60 22 C68 22 84 34 82 58 C78 48 70 40 60 42 C50 40 42 48 38 58Z" fill="#4a2e1c"/>
        <path d="M38 58 C40 76 40 96 36 118 C30 96 30 70 38 58Z" fill="#3a2417"/>
        <path d="M82 58 C80 76 80 96 84 118 C90 96 90 70 82 58Z" fill="#3a2417"/>
        <circle cx="52" cy="60" r="2.4" fill="#3a2417"/>
        <circle cx="68" cy="60" r="2.4" fill="#3a2417"/>
        <path d="M48 53 q4 -3 8 -.5" stroke="#3a2417" stroke-width="1.6" fill="none" stroke-linecap="round"/>
        <path d="M64 52.5 q4 -2.5 8 .5" stroke="#3a2417" stroke-width="1.6" fill="none" stroke-linecap="round"/>
        <path d="M54 71 q6 5 12 0" fill="#d34d57"/>
        <circle cx="47" cy="66" r="3" fill="#f3a6a0" opacity=".5"/>
        <circle cx="73" cy="66" r="3" fill="#f3a6a0" opacity=".5"/>
      </g>
    </svg>

    <!-- ===== GREEN HYUNDAI ACCENT 1998 — 3/4 front view, parked, static ===== -->
    <div class="car-shadow"></div>
    <svg class="car" viewBox="0 0 640 320" role="img" aria-label="A dark teal-green 1998 Hyundai Accent parked on the pavement, seen from the front three-quarter angle.">
      <defs>
        <!-- weathered petrol-green paint, like the photo -->
        <linearGradient id="bodyTop" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#3c6f63"/>
          <stop offset=".5" stop-color="#1f4a43"/>
          <stop offset="1" stop-color="#143630"/>
        </linearGradient>
        <linearGradient id="bodySide" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#2e5a51"/>
          <stop offset=".45" stop-color="#21463f"/>
          <stop offset="1" stop-color="#10271f"/>
        </linearGradient>
        <linearGradient id="bonnet" x1="0" y1="0" x2="1" y2=".4">
          <stop offset="0" stop-color="#4a7d70"/>
          <stop offset=".55" stop-color="#24514a"/>
          <stop offset="1" stop-color="#173c34"/>
        </linearGradient>
        <linearGradient id="glass" x1="0" y1="0" x2=".4" y2="1">
          <stop offset="0" stop-color="#aec7d2"/>
          <stop offset=".5" stop-color="#6f8b96"/>

        </linearGradient>
        <radialGradient id="tyre" cx="42%" cy="40%" r="62%">
          <stop offset="0" stop-color="#3a3a3c"/><stop offset=".7" stop-color="#161617"/><stop offset="1" stop-color="#070708"/>
        </radialGradient>
        <radialGradient id="hub" cx="42%" cy="38%" r="60%">
          <stop offset="0" stop-color="#e7e9ec"/><stop offset=".6" stop-color="#aab0b6"/><stop offset="1" stop-color="#6c7178"/>
        </radialGradient>
        <linearGradient id="bumper" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#274c44"/><stop offset="1" stop-color="#0f261f"/>
        </linearGradient>
        <!-- glossy specular sweep gradient -->
        <linearGradient id="sheenGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
          <stop offset=".45" stop-color="#eafff8" stop-opacity="0"/>
          <stop offset=".5" stop-color="#f4fffc" stop-opacity=".75"/>
          <stop offset=".55" stop-color="#eafff8" stop-opacity="0"/>
          <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
        </linearGradient>
        <!-- silhouette of painted panels, so the sheen only crosses the bodywork -->
        <clipPath id="carClip">
          <path d="M150 150 C160 120 230 110 300 108 L470 112 C500 116 540 130 560 152 L568 196 C568 214 558 222 540 224 L120 224 C104 224 96 214 98 198 L108 168 C116 156 132 152 150 150 Z"/>
          <path d="M214 110 C236 88 268 80 318 80 L452 84 C486 86 506 98 520 116 L470 112 L300 108 C262 110 236 112 214 110 Z"/>
          <path d="M98 198 C92 176 96 162 110 150 C90 156 70 170 56 192 C44 210 44 224 58 232 L120 232 C104 230 98 216 98 198 Z"/>
        </clipPath>
      </defs>

      <!-- ===== BODY ===== -->
      <!-- left side flank (running toward the back, slightly receding) -->
      <path d="M150 150
               C160 120 230 110 300 108
               L470 112
               C500 116 540 130 560 152
               L568 196
               C568 214 558 222 540 224
               L120 224
               C104 224 96 214 98 198
               L108 168
               C116 156 132 152 150 150 Z"
            fill="url(#bodySide)" stroke="#0c211b" stroke-width="2.5"/>

      <!-- front three-quarter mass (bonnet + front wing facing us, lower-left) -->

               C92 176 96 162 110 150
               C90 156 70 170 56 192
               C44 210 44 224 58 232
               L120 232
               C104 230 98 216 98 198 Z"

      <!-- bonnet top plane -->
      <path d="M110 150 C120 134 150 126 190 124 L150 150 C132 152 116 156 108 168 Z"

      <!-- ===== GREENHOUSE / ROOF ===== -->

               C236 88 268 80 318 80
               L452 84
               C486 86 506 98 520 116
               L470 112 L300 108 C262 110 236 112 214 110 Z"
            fill="url(#bodyTop)" stroke="#0c211b" stroke-width="2.5"/>

      <!-- windscreen + side windows -->
      <path d="M228 110 C246 92 272 86 312 86 L350 88 L350 110 Z" fill="url(#glass)" stroke="#0c211b" stroke-width="2"/>
      <path d="M360 88 L450 90 C480 92 496 100 506 112 L360 110 Z" fill="url(#glass)" stroke="#0c211b" stroke-width="2"/>
      <rect x="350" y="88" width="9" height="23" fill="#0c211b"/>
      <!-- glass reflection streak -->

      <!-- chrome window trim -->

      <!-- body crease / character line -->

      <!-- door handles -->

      <rect x="452" y="168" width="22" height="6" rx="3" fill="#0c211b"/>

      <!-- ===== FRONT END details ===== -->

      <!-- amber indicator -->

        <line x1="486" y1="246" x2="486" y2="225"/>
        <line x1="486" y1="246" x2="504" y2="256"/>
        <line x1="486" y1="246" x2="501" y2="263"/>
        <line x1="486" y1="246" x2="471" y2="263"/>
        <line x1="486" y1="246" x2="468" y2="256"/>
      </g>
      <circle cx="486" cy="246" r="6" fill="#5c6066"/>
      <path d="M436 246 a50 48 0 0 1 100 0" fill="none" stroke="#0c211b" stroke-width="3" opacity=".5"/>

      <!-- rocker panel / sill -->
      <path d="M230 224 L470 226 L466 234 L234 232 Z" fill="#0c211b" opacity=".7"/>

      <!-- glossy specular highlight that slowly sweeps across the paint -->
      <g clip-path="url(#carClip)">
        <rect class="sheen" x="-260" y="60" width="220" height="180" fill="url(#sheenGrad)" transform="skewX(-22)"/>
      </g>
    </svg>
  </div>

   </div><!-- /camera -->

   <!-- floating dust motes in the light -->
   <div class="motes">
     <span class="mote" style="left:24%;top:60%;animation-duration:11s;animation-delay:0s"></span>
     <span class="mote" style="left:38%;top:66%;animation-duration:14s;animation-delay:2s"></span>
     <span class="mote" style="left:52%;top:58%;animation-duration:9s;animation-delay:4s"></span>
     <span class="mote" style="left:63%;top:64%;animation-duration:13s;animation-delay:1s"></span>
     <span class="mote" style="left:72%;top:55%;animation-duration:16s;animation-delay:5s"></span>
     <span class="mote" style="left:30%;top:52%;animation-duration:12s;animation-delay:6s"></span>
   </div>

   <!-- colour grade + vignette + grain -->
   <div class="grade"></div>
</body>
</html>
