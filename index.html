<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Empire Studios</title>
<meta name="description" content="Empire Studios — the gates are open." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800;900&family=Cinzel+Decorative:wght@700;900&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg-top:#0a0a12;
    --bg-mid:#141019;
    --bg-low:#1c1410;
    --gold:#C8962A;
    --gold-bright:#F4D88A;
    --gold-deep:#8A6515;
    --glow:#FFE9B0;
    --ink:#0c0a08;
    --ease:cubic-bezier(.16,1,.3,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:#070509;
    color:#F1E7D5;
    font-family:"Cinzel",Georgia,serif;
    overflow:hidden;
  }

  /* ===== SCENE ===== */
  .scene{
    position:relative;
    width:100%;
    min-height:100vh;min-height:100dvh;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    gap:clamp(18px,3.5vh,46px);
    padding:5vh 16px 0;
    overflow:hidden;
    isolation:isolate;
  }

  /* ----- Background sky ----- */
  .sky{
    position:absolute;inset:0;z-index:-3;
    background:
      radial-gradient(120% 80% at 50% 118%, rgba(200,150,42,.28), transparent 55%),
      radial-gradient(80% 60% at 50% -8%, rgba(120,120,180,.10), transparent 60%),
      linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 48%, var(--bg-low) 100%);
  }
  /* moon glow behind castle */
  .moon{
    position:absolute;left:50%;top:30%;z-index:-3;
    width:min(70vw,560px);aspect-ratio:1;transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(255,233,176,.20), rgba(255,233,176,.06) 40%, transparent 68%);
    filter:blur(6px);
  }
  /* stars */
  .stars,.stars::after{
    position:absolute;top:0;left:0;width:2px;height:2px;border-radius:50%;background:transparent;z-index:-3;
  }
  .stars{
    box-shadow:
      40px 60px #fff,180px 120px #ffe9b0,320px 40px #fff,500px 160px #fff,
      680px 80px #ffe9b0,860px 140px #fff,1040px 60px #fff,1220px 110px #ffe9b0,
      120px 200px #fff,420px 240px #fff,760px 220px #ffe9b0,980px 260px #fff,
      1300px 200px #fff,60px 320px #fff,260px 300px #ffe9b0,620px 340px #fff,
      900px 300px #fff,1180px 340px #fff,200px 30px #fff,540px 90px #ffe9b0,
      1000px 180px #fff,1340px 70px #fff,360px 150px #fff,720px 30px #fff;
    animation:twinkle 4s ease-in-out infinite alternate;
  }
  .stars::after{content:"";box-shadow:
      90px 90px #fff,240px 50px #fff,470px 200px #ffe9b0,650px 150px #fff,
      820px 60px #fff,1080px 130px #ffe9b0,1260px 40px #fff,150px 270px #fff,
      390px 120px #fff,710px 280px #fff,950px 90px #ffe9b0,1150px 230px #fff;
    animation:twinkle 5.5s ease-in-out infinite alternate-reverse;}
  @keyframes twinkle{from{opacity:.35}to{opacity:1}}

  /* ground mist */
  .mist{
    position:absolute;left:0;right:0;bottom:0;height:34%;z-index:-2;
    background:linear-gradient(180deg,transparent, rgba(28,20,16,.65) 55%, rgba(10,7,5,.95));
  }
  .vignette{position:absolute;inset:0;z-index:-1;pointer-events:none;
    box-shadow:inset 0 0 220px 60px rgba(0,0,0,.7), inset 0 -60px 120px rgba(0,0,0,.6);}

  /* ===== TITLE ===== */
  .title-wrap{
    text-align:center;z-index:2;
    opacity:0;transform:translateY(-26px);
    animation:titleIn 1.1s var(--ease) .25s forwards;
  }
  @keyframes titleIn{to{opacity:1;transform:none}}

  .kicker{
    font-family:"Cinzel",serif;font-weight:600;
    font-size:clamp(.6rem,1.6vw,.8rem);letter-spacing:.55em;
    text-transform:uppercase;color:var(--gold);margin-left:.55em;
    opacity:.9;
  }
  .title{
    font-family:"Cinzel Decorative","Cinzel",serif;font-weight:900;
    font-size:clamp(2.6rem,9.5vw,7rem);line-height:1;
    letter-spacing:.06em;text-transform:uppercase;
    margin:.18em 0;
    background:linear-gradient(180deg,#FFF6DC 0%,#F4D88A 28%,#C8962A 55%,#8A6515 78%,#E8C36B 100%);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent;
    filter:drop-shadow(0 2px 1px rgba(0,0,0,.55)) drop-shadow(0 0 26px rgba(200,150,42,.35));
    position:relative;
  }
  /* moving sheen across the letters */
  .title::after{
    content:"Empire Studios";
    position:absolute;inset:0;
    text-transform:uppercase;
    background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.85) 50%,transparent 62%);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent;
    background-size:250% 100%;background-repeat:no-repeat;
    animation:sheen 5s ease-in-out 1.6s infinite;
    opacity:.85;
  }
  @keyframes sheen{
    0%{background-position:160% 0}
    35%,100%{background-position:-60% 0}
  }

  /* ornamental flourish */
  .flourish{width:clamp(180px,32vw,360px);height:22px;color:var(--gold);margin:.2em auto 0;opacity:.85}

  /* ===== CASTLE ===== */
  .castle-wrap{
    position:relative;z-index:1;width:min(92vw,640px);
    opacity:0;transform:translateY(34px) scale(.98);
    animation:castleIn 1.3s var(--ease) .45s forwards;
  }
  @keyframes castleIn{to{opacity:1;transform:none}}
  .castle{width:100%;height:auto;display:block;
    filter:drop-shadow(0 40px 50px rgba(0,0,0,.6));}

  /* gate light */
  .gate-glow{opacity:.18;animation:glowUp 1.9s ease 1.5s forwards;transform-origin:center;}
  @keyframes glowUp{to{opacity:1}}
  .gate-core{opacity:0;animation:coreUp 1.6s ease 1.7s forwards;}
  @keyframes coreUp{to{opacity:1}}
  .light-flicker{animation:flicker 3.5s ease-in-out 3.6s infinite;}
  @keyframes flicker{0%,100%{opacity:1}45%{opacity:.86}70%{opacity:.95}}
  .beam{opacity:0;transform-origin:50% 0;animation:beamUp 2s ease 1.9s forwards;}
  @keyframes beamUp{to{opacity:.5}}

  /* the two doors — swing open */
  .door{transform-box:fill-box;}
  .door-left{transform-origin:left center;animation:openLeft 2s var(--ease) 1.3s forwards;}
  .door-right{transform-origin:right center;animation:openRight 2s var(--ease) 1.3s forwards;}
  @keyframes openLeft{from{transform:scaleX(1)}to{transform:scaleX(.05)}}
  @keyframes openRight{from{transform:scaleX(1)}to{transform:scaleX(.05)}}

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important}
    .title-wrap,.castle-wrap{opacity:1;transform:none}
    .gate-glow,.gate-core{opacity:1}
    .beam{opacity:.5}
    .door-left,.door-right{transform:scaleX(.05)}
  }
</style>
</head>
<body>
  <div class="scene">
    <div class="sky"></div>
    <div class="moon"></div>
    <div class="stars"></div>
    <div class="mist"></div>
    <div class="vignette"></div>

    <!-- ===== TITLE ===== -->
    <div class="title-wrap">
      <div class="kicker">— By Royal Decree —</div>
      <h1 class="title">Empire Studios</h1>
      <svg class="flourish" viewBox="0 0 360 22" fill="none" aria-hidden="true">
        <path d="M180 11 l16 -7 -16 7 16 7z" fill="currentColor"/>
        <circle cx="180" cy="11" r="3.2" fill="currentColor"/>
        <path d="M176 11 H40" stroke="currentColor" stroke-width="1.4"/>
        <path d="M184 11 H320" stroke="currentColor" stroke-width="1.4"/>
        <path d="M40 11 l-10 -5 0 10z" fill="currentColor"/>
        <path d="M320 11 l10 -5 0 10z" fill="currentColor"/>
        <circle cx="26" cy="11" r="2.4" fill="currentColor"/>
        <circle cx="334" cy="11" r="2.4" fill="currentColor"/>
      </svg>
    </div>

    <!-- ===== CASTLE WITH OPENING GATES ===== -->
    <div class="castle-wrap">
      <svg class="castle" viewBox="0 0 460 440" role="img"
           aria-label="A grand empire castle with golden gates swinging open to reveal warm light.">
        <defs>
          <linearGradient id="stoneFront" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#574737"/><stop offset="1" stop-color="#2A2118"/>
          </linearGradient>
          <linearGradient id="stoneTower" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#63513E"/><stop offset=".55" stop-color="#473829"/><stop offset="1" stop-color="#2E2419"/>
          </linearGradient>
          <linearGradient id="stoneDark" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#3C3022"/><stop offset="1" stop-color="#211a12"/>
          </linearGradient>
          <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#9A3A2E"/><stop offset=".5" stop-color="#7A2A22"/><stop offset="1" stop-color="#521914"/>
          </linearGradient>
          <linearGradient id="roofKeep" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#A8412F"/><stop offset=".5" stop-color="#822C22"/><stop offset="1" stop-color="#561a14"/>
          </linearGradient>
          <radialGradient id="glow" cx="50%" cy="62%" r="62%">
            <stop offset="0" stop-color="#FFF6DA"/><stop offset=".35" stop-color="#FBE3A0"/>
            <stop offset=".7" stop-color="#E0A93C"/><stop offset="1" stop-color="#7d5410"/>
          </radialGradient>
          <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#6E4D24"/><stop offset=".5" stop-color="#5A3D1B"/><stop offset="1" stop-color="#3E2912"/>
          </linearGradient>
          <linearGradient id="flag" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#F4D88A"/><stop offset="1" stop-color="#C8962A"/>
          </linearGradient>
          <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="7"/>
          </filter>
          <filter id="softer" x="-80%" y="-80%" width="260%" height="260%">
            <feGaussianBlur stdDeviation="16"/>
          </filter>
          <clipPath id="gateClip">
            <path d="M186 406 L186 300 A44 44 0 0 1 274 300 L274 406 Z"/>
          </clipPath>
        </defs>

        <!-- ground -->
        <ellipse cx="230" cy="416" rx="230" ry="20" fill="#0b0805" opacity=".75"/>
        <rect x="20" y="405" width="420" height="20" fill="url(#stoneDark)"/>

        <!-- ===== BACK CURTAIN WALL ===== -->
        <rect x="96" y="210" width="268" height="196" fill="url(#stoneDark)"/>
        <g fill="url(#stoneDark)">
          <rect x="96" y="198" width="20" height="16"/><rect x="128" y="198" width="20" height="16"/>
          <rect x="160" y="198" width="20" height="16"/><rect x="280" y="198" width="20" height="16"/>
          <rect x="312" y="198" width="20" height="16"/><rect x="344" y="198" width="20" height="16"/>
        </g>

        <!-- ===== OUTER TOWERS ===== -->
        <!-- left -->
        <g>
          <rect x="40" y="150" width="70" height="256" fill="url(#stoneTower)" stroke="#1c150e" stroke-width="2"/>
          <g fill="url(#stoneTower)" stroke="#1c150e" stroke-width="2">
            <rect x="40" y="136" width="16" height="18"/><rect x="63" y="136" width="16" height="18"/><rect x="86" y="136" width="18" height="18"/>
          </g>
          <path d="M34 136 L75 84 L116 136 Z" fill="url(#roof)" stroke="#1c150e" stroke-width="2"/>
          <line x1="75" y1="84" x2="75" y2="54" stroke="#C8962A" stroke-width="2.5"/>
          <path d="M75 56 L104 62 L75 72 Z" fill="url(#flag)"/>
        </g>
        <!-- right -->
        <g>
          <rect x="350" y="150" width="70" height="256" fill="url(#stoneTower)" stroke="#1c150e" stroke-width="2"/>
          <g fill="url(#stoneTower)" stroke="#1c150e" stroke-width="2">
            <rect x="356" y="136" width="18" height="18"/><rect x="381" y="136" width="16" height="18"/><rect x="404" y="136" width="16" height="18"/>
          </g>
          <path d="M344 136 L385 84 L426 136 Z" fill="url(#roof)" stroke="#1c150e" stroke-width="2"/>
          <line x1="385" y1="84" x2="385" y2="54" stroke="#C8962A" stroke-width="2.5"/>
          <path d="M385 56 L356 62 L385 72 Z" fill="url(#flag)"/>
        </g>

        <!-- tower windows (glowing) -->
        <g class="light-flicker">
          <g fill="url(#glow)" filter="url(#soft)" opacity=".9">
            <rect x="60" y="186" width="14" height="22" rx="7"/><rect x="60" y="240" width="14" height="22" rx="7"/>
            <rect x="370" y="186" width="14" height="22" rx="7"/><rect x="370" y="240" width="14" height="22" rx="7"/>
          </g>
          <g fill="#FFF0C0">
            <rect x="63" y="189" width="8" height="16" rx="4"/><rect x="63" y="243" width="8" height="16" rx="4"/>
            <rect x="373" y="189" width="8" height="16" rx="4"/><rect x="373" y="243" width="8" height="16" rx="4"/>
          </g>
        </g>

        <!-- ===== CENTRAL KEEP ===== -->
        <rect x="150" y="118" width="160" height="288" fill="url(#stoneFront)" stroke="#1c150e" stroke-width="2"/>
        <g fill="url(#stoneFront)" stroke="#1c150e" stroke-width="2">
          <rect x="150" y="104" width="20" height="18"/><rect x="182" y="104" width="20" height="18"/>
          <rect x="214" y="104" width="20" height="18"/><rect x="258" y="104" width="20" height="18"/>
          <rect x="290" y="104" width="20" height="18"/>
        </g>
        <path d="M142 104 L230 40 L318 104 Z" fill="url(#roofKeep)" stroke="#1c150e" stroke-width="2"/>
        <path d="M142 104 L230 40 L236 44 L156 104 Z" fill="#fff" opacity=".06"/>
        <line x1="230" y1="40" x2="230" y2="6" stroke="#C8962A" stroke-width="3"/>
        <circle cx="230" cy="8" r="3.5" fill="#F4D88A"/>
        <path d="M230 12 L276 20 L230 34 Z" fill="url(#flag)"/>

        <!-- keep windows -->
        <g class="light-flicker">
          <g fill="url(#glow)" filter="url(#soft)" opacity=".85">
            <rect x="176" y="150" width="16" height="26" rx="8"/><rect x="268" y="150" width="16" height="26" rx="8"/>
            <rect x="222" y="142" width="16" height="26" rx="8"/>
          </g>
          <g fill="#FFF0C0">
            <rect x="179" y="153" width="10" height="20" rx="5"/><rect x="271" y="153" width="10" height="20" rx="5"/>
            <rect x="225" y="145" width="10" height="20" rx="5"/>
          </g>
        </g>

        <!-- subtle stone courses -->
        <g stroke="#1c150e" stroke-width="1" opacity=".25">
          <line x1="150" y1="170" x2="310" y2="170"/><line x1="150" y1="210" x2="310" y2="210"/>
          <line x1="150" y1="250" x2="310" y2="250"/><line x1="150" y1="290" x2="310" y2="290"/>
          <line x1="40" y1="200" x2="110" y2="200"/><line x1="40" y1="250" x2="110" y2="250"/><line x1="40" y1="300" x2="110" y2="300"/>
          <line x1="350" y1="200" x2="420" y2="200"/><line x1="350" y1="250" x2="420" y2="250"/><line x1="350" y1="300" x2="420" y2="300"/>
        </g>

        <!-- ===== GATEHOUSE ===== -->
        <rect x="172" y="250" width="116" height="156" fill="url(#stoneFront)" stroke="#1c150e" stroke-width="2"/>
        <g fill="url(#stoneFront)" stroke="#1c150e" stroke-width="2">
          <rect x="172" y="238" width="18" height="16"/><rect x="201" y="238" width="18" height="16"/>
          <rect x="241" y="238" width="18" height="16"/><rect x="270" y="238" width="18" height="16"/>
        </g>

        <!-- gateway recess (dark) -->
        <path d="M186 406 L186 300 A44 44 0 0 1 274 300 L274 406 Z" fill="#0d0a06"/>

        <!-- golden light pouring out -->
        <g class="gate-glow" clip-path="url(#gateClip)">
          <path d="M186 406 L186 300 A44 44 0 0 1 274 300 L274 406 Z" fill="url(#glow)"/>
          <g class="gate-core light-flicker">
            <ellipse cx="230" cy="330" rx="60" ry="80" fill="#FFF3CC" filter="url(#softer)" opacity=".9"/>
            <ellipse cx="230" cy="356" rx="26" ry="50" fill="#FFFBEF" filter="url(#soft)"/>
          </g>
        </g>

        <!-- light beam spilling onto the ground -->
        <path class="beam light-flicker" d="M188 406 L150 430 L310 430 L272 406 Z" fill="url(#glow)" filter="url(#soft)"/>

        <!-- ===== THE TWO DOORS (swing open) ===== -->
        <g class="door door-left">
          <path d="M186 406 L186 300 A44 44 0 0 1 230 256 L230 406 Z" fill="url(#wood)" stroke="#2a1c0c" stroke-width="2"/>
          <g stroke="#2a1c0c" stroke-width="1.3" opacity=".7">
            <line x1="200" y1="278" x2="200" y2="404"/><line x1="214" y1="266" x2="214" y2="404"/>
          </g>
          <g fill="#3a2913" opacity=".9">
            <rect x="190" y="300" width="40" height="7" rx="2"/><rect x="190" y="356" width="40" height="7" rx="2"/>
          </g>
          <g fill="#E8C36B">
            <circle cx="193" cy="304" r="2"/><circle cx="223" cy="304" r="2"/>
            <circle cx="193" cy="360" r="2"/><circle cx="223" cy="360" r="2"/>
          </g>
          <circle cx="224" cy="338" r="5" fill="none" stroke="#3a2913" stroke-width="3"/>
        </g>
        <g class="door door-right">
          <path d="M274 406 L274 300 A44 44 0 0 0 230 256 L230 406 Z" fill="url(#wood)" stroke="#2a1c0c" stroke-width="2"/>
          <g stroke="#2a1c0c" stroke-width="1.3" opacity=".7">
            <line x1="260" y1="278" x2="260" y2="404"/><line x1="246" y1="266" x2="246" y2="404"/>
          </g>
          <g fill="#3a2913" opacity=".9">
            <rect x="230" y="300" width="40" height="7" rx="2"/><rect x="230" y="356" width="40" height="7" rx="2"/>
          </g>
          <g fill="#E8C36B">
            <circle cx="237" cy="304" r="2"/><circle cx="267" cy="304" r="2"/>
            <circle cx="237" cy="360" r="2"/><circle cx="267" cy="360" r="2"/>
          </g>
          <circle cx="236" cy="338" r="5" fill="none" stroke="#3a2913" stroke-width="3"/>
        </g>

        <!-- arch frame on top -->
        <path d="M186 406 L186 300 A44 44 0 0 1 274 300 L274 406"
              fill="none" stroke="#1c150e" stroke-width="6"/>
        <path d="M186 406 L186 300 A44 44 0 0 1 274 300 L274 406"
              fill="none" stroke="#C8962A" stroke-width="2" opacity=".55"/>
        <!-- keystone -->
        <path d="M222 252 L238 252 L234 270 L226 270 Z" fill="#E8C36B" stroke="#1c150e" stroke-width="1.2"/>
      </svg>
    </div>
  </div>
</body>
</html>
